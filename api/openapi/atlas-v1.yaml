openapi: 3.1.0
info:
  title: Atlas API
  version: 0.5.0
  description: >
    Atlas REST API contract for the fake-provider scaffold. Covers local
    health, current-cluster inventory reads (identity, health, OSDs, Hosts,
    Storage Devices, Ceph Daemons, Pools), explicit inventory sync run
    history, read-only case records, and the authenticated operator identity
    probe. Write endpoints carry a bearer-token security scheme; existing
    read endpoints remain public. 0.5.0 adds attaching Workflow Instances to
    Cases.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Platform
  - name: Clusters
  - name: Inventory
  - name: Cases
  - name: Identity
paths:
  /healthz:
    get:
      tags:
        - Platform
      operationId: getHealthz
      summary: Check API process health
      responses:
        "200":
          description: API process is serving requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"
              examples:
                ok:
                  value:
                    status: ok
  /api/v1/me:
    get:
      tags:
        - Identity
      operationId: getMe
      summary: Get the authenticated operator identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identity of the operator whose bearer token was verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
              examples:
                operator:
                  value:
                    subject: operator-1
                    displayName: Storage Operator
        "401":
          description: No bearer token was presented, the token failed verification, or authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    error:
                      class: Unauthorized
                      message: missing bearer token
  /api/v1/clusters:
    post:
      tags:
        - Clusters
      operationId: createClusterRegistration
      summary: Register a cluster
      description: >
        Registers a Cluster (ADR-0025) and returns the one-time Enrollment
        Credential exactly once. The credential is stored only as a hash,
        expires if unused, and is never returned by any other endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClusterRegistrationRequest"
            examples:
              prodCluster:
                value:
                  name: prod-ceph-a
                  clusterType: bare-metal
      responses:
        "201":
          description: Registered cluster with its one-time enrollment credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateClusterRegistrationResponse"
        "400":
          description: Request body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No bearer token was presented, the token failed verification, or authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    error:
                      class: Unauthorized
                      message: missing bearer token
        "422":
          description: Cluster registration requires the postgres read source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/clusters/{id}:
    get:
      tags:
        - Clusters
      operationId: getClusterRegistration
      summary: Get a cluster registration
      parameters:
        - name: id
          in: path
          required: true
          description: Cluster registration id.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Cluster registration detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterRegistration"
        "404":
          description: No cluster registration exists with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Cluster registration requires the postgres read source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Clusters
      operationId: deregisterCluster
      summary: Deregister a cluster
      description: >
        Retires the registration and consumes any live Enrollment
        Credential. Snapshots and Cases are preserved untouched.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Cluster registration id.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Deregistered cluster registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterRegistration"
        "401":
          description: No bearer token was presented, the token failed verification, or authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No cluster registration exists with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The cluster is already deregistered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Cluster registration requires the postgres read source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/clusters/current:
    get:
      tags:
        - Clusters
      operationId: getCurrentCluster
      summary: Get the current cluster identity
      responses:
        "200":
          description: Current cluster identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterIdentity"
              examples:
                reefBareMetal:
                  value:
                    fsid: 00000000-0000-4000-8000-000000000101
                    name: reef-baremetal-healthy
                    cephVersion: 18.2.x
                    type: bare-metal
        default:
          $ref: "#/components/responses/Error"
  /api/v1/clusters/current/health:
    get:
      tags:
        - Clusters
      operationId: getCurrentClusterHealth
      summary: Get the current cluster health
      responses:
        "200":
          description: Current cluster health summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterHealth"
              examples:
                healthWarn:
                  value:
                    status: HEALTH_WARN
                    summary: 1 osd down
                    checks:
                      - name: OSD_DOWN
                        severity: HEALTH_WARN
                        summary: 1 osd down
        default:
          $ref: "#/components/responses/Error"
  /api/v1/clusters/current/osds:
    get:
      tags:
        - Clusters
      operationId: listCurrentClusterOSDs
      summary: List OSD inventory for the current cluster
      responses:
        "200":
          description: Current cluster OSD inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OSD"
              examples:
                osds:
                  value:
                    - id: 0
                      host: host-a.example.invalid
                      up: true
                      in: true
                      device: nvme-serial-a
                    - id: 1
                      host: host-b.example.invalid
                      up: false
                      in: true
                      device: nvme-serial-b
        default:
          $ref: "#/components/responses/Error"
  /api/v1/clusters/current/hosts:
    get:
      tags:
        - Clusters
      operationId: listCurrentClusterHosts
      summary: List Host inventory for the current cluster
      responses:
        "200":
          description: Current cluster Host inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Host"
              examples:
                hosts:
                  value:
                    - name: host-a.example.invalid
                      address: 192.0.2.11
                    - name: host-b.example.invalid
                      address: 192.0.2.12
        default:
          $ref: "#/components/responses/Error"
  /api/v1/clusters/current/storage-devices:
    get:
      tags:
        - Clusters
      operationId: listCurrentClusterStorageDevices
      summary: List Storage Device inventory for the current cluster
      description: >
        Flat listing across all Hosts. Each Storage Device names its Host and,
        where one exists, the OSD identity it currently backs. The OSD link is
        point-in-time; a Storage Device may back different OSD identities over
        time.
      responses:
        "200":
          description: Current cluster Storage Device inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageDevice"
              examples:
                devices:
                  value:
                    - host: host-a.example.invalid
                      serial: nvme-serial-a
                      type: nvme
                      path: /dev/nvme0n1
                      health: ok
                      osdId: 0
                    - host: host-b.example.invalid
                      serial: nvme-serial-b
                      type: nvme
                      path: /dev/nvme0n1
                      health: error
                      osdId: 1
                    - host: host-c.example.invalid
                      serial: spare-serial-c
                      type: ssd
                      path: /dev/sdb
                      health: ok
        default:
          $ref: "#/components/responses/Error"
  /api/v1/clusters/current/daemons:
    get:
      tags:
        - Clusters
      operationId: listCurrentClusterDaemons
      summary: List Ceph Daemon inventory for the current cluster
      responses:
        "200":
          description: Current cluster Ceph Daemon inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Daemon"
              examples:
                daemons:
                  value:
                    - type: mon
                      name: mon.a
                      host: host-a.example.invalid
                      status: running
                      version: 18.2.x
                    - type: osd
                      name: osd.1
                      host: host-b.example.invalid
                      status: stopped
                      version: 18.2.x
        default:
          $ref: "#/components/responses/Error"
  /api/v1/clusters/current/pools:
    get:
      tags:
        - Clusters
      operationId: listCurrentClusterPools
      summary: List Pool inventory for the current cluster
      responses:
        "200":
          description: Current cluster Pool inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pool"
              examples:
                pools:
                  value:
                    - id: 1
                      name: device_health_metrics
                      type: replicated
                      size: 3
                      minSize: 2
                    - id: 2
                      name: .mgr
                      type: replicated
                      size: 3
                      minSize: 2
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory-sync-runs:
    get:
      tags:
        - Inventory
      operationId: listInventorySyncRuns
      summary: List recent inventory sync runs
      responses:
        "200":
          description: Recent inventory sync run history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventorySyncRun"
              examples:
                runs:
                  value:
                    - id: 2
                      provider: fake
                      scenario: missing
                      status: failed
                      startedAt: "2026-08-13T12:01:00Z"
                      finishedAt: "2026-08-13T12:01:01Z"
                      errorClass: Unavailable
                      errorMessage: "Unavailable: read fixture"
                    - id: 1
                      provider: fake
                      scenario: reef-osd-down-baremetal
                      status: succeeded
                      startedAt: "2026-08-13T12:00:00Z"
                      finishedAt: "2026-08-13T12:00:01Z"
                      snapshotId: 1
        default:
          $ref: "#/components/responses/Error"
  /api/v1/alert-evaluation-runs:
    get:
      tags:
        - Inventory
      operationId: listAlertEvaluationRuns
      summary: List recent alert evaluation runs
      responses:
        "200":
          description: Recent alert evaluation run history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertEvaluationRun"
              examples:
                runs:
                  value:
                    - id: 2
                      provider: fake
                      scenario: osd-down-alert
                      status: succeeded
                      startedAt: "2026-08-14T09:20:00Z"
                      finishedAt: "2026-08-14T09:20:01Z"
                      alertsEvaluated: 1
                      casesCreated: 1
                    - id: 1
                      provider: fake
                      scenario: provider-unauthorized
                      status: failed
                      startedAt: "2026-08-14T09:15:00Z"
                      finishedAt: "2026-08-14T09:15:01Z"
                      errorClass: Unauthorized
                      errorMessage: "Unauthorized: simulated observability source rejected provider credentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/cases:
    get:
      tags:
        - Cases
      operationId: listCases
      summary: List cases
      responses:
        "200":
          description: Recent cases ordered by most recent update.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
              examples:
                seededCases:
                  value:
                    - id: 2
                      title: Review weekly capacity trend
                      summary: Local seed case for capacity review without an automation workflow attached.
                      status: triaged
                      severity: medium
                      source: manual
                      clusterFsid: 00000000-0000-4000-8000-000000000101
                      createdAt: "2026-08-13T12:05:00Z"
                      updatedAt: "2026-08-13T12:10:00Z"
                    - id: 1
                      title: OSD down requires triage
                      summary: Local seed case representing an OSD_DOWN health check that needs operator triage.
                      status: detected
                      severity: high
                      source: prometheus
                      clusterFsid: 00000000-0000-4000-8000-000000000101
                      createdAt: "2026-08-13T12:00:00Z"
                      updatedAt: "2026-08-13T12:00:00Z"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Cases
      operationId: createCase
      summary: Create a manual case
      description: >
        Creates a Case in the detected status with source forced to manual and
        records a case_detected Timeline Event attributed to the verified
        operator.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
            examples:
              capacityReview:
                value:
                  title: Manual review of slow OSD warnings
                  summary: Operator noticed slow OSD alerts outside automated detection.
                  severity: medium
                  clusterFsid: 00000000-0000-4000-8000-000000000101
      responses:
        "201":
          description: Created case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Request body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No bearer token was presented, the token failed verification, or authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Case writes require the postgres read source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/cases/{id}:
    get:
      tags:
        - Cases
      operationId: getCase
      summary: Get a case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Case detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/cases/{id}/timeline:
    get:
      tags:
        - Cases
      operationId: listCaseTimeline
      summary: List a case timeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Case Timeline Events ordered oldest to newest.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"
              examples:
                seededTimeline:
                  value:
                    - id: 2
                      caseId: 2
                      type: case_detected
                      message: Manual capacity review case created.
                      occurredAt: "2026-08-13T12:05:00Z"
                      actor:
                        type: user
                        displayName: Storage Operator
                      payload:
                        source: manual
                        clusterFsid: 00000000-0000-4000-8000-000000000101
                    - id: 3
                      caseId: 2
                      type: case_triaged
                      message: Capacity review case triaged.
                      occurredAt: "2026-08-13T12:10:00Z"
                      actor:
                        type: user
                        displayName: Storage Operator
                      payload:
                        previousStatus: detected
                        newStatus: triaged
        default:
          $ref: "#/components/responses/Error"
  /api/v1/cases/{id}/transitions:
    post:
      tags:
        - Cases
      operationId: transitionCase
      summary: Transition a case status
      description: >
        Applies a manual lifecycle transition and records the matching
        Timeline Event (case_triaged or case_status_changed). Allowed edges
        are detected -> triaged, detected -> closed, and triaged -> closed;
        closed is terminal and reopening means creating a new case.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionCaseRequest"
            examples:
              triage:
                value:
                  status: triaged
      responses:
        "200":
          description: Updated case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Unknown target status or malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No bearer token was presented, the token failed verification, or authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Case not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The requested transition is not allowed from the current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Case writes require the postgres read source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/cases/{id}/assignment:
    post:
      tags:
        - Cases
      operationId: assignCase
      summary: Assign or unassign a case
      description: >
        Sets the Operator responsible for a Case and records a case_assigned
        Timeline Event. An empty assignee unassigns. Assigning the current
        assignee is an idempotent no-op. Closed Cases cannot be reassigned.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCaseRequest"
            examples:
              assign:
                value:
                  assignee: operator-2
                  assigneeDisplayName: Second Operator
              unassign:
                value:
                  assignee: ""
                  assigneeDisplayName: ""
      responses:
        "200":
          description: Updated case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Malformed body or inconsistent assignee fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No bearer token was presented, the token failed verification, or authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Case not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The case is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Case writes require the postgres read source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/cases/{id}/notes:
    get:
      tags:
        - Cases
      operationId: listCaseNotes
      summary: List case notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Case Notes ordered oldest to newest.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseNote"
        "404":
          description: Case not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Cases
      operationId: addCaseNote
      summary: Add a note to a case
      description: Records a durable Case Note and a case_note_added Timeline Event.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCaseNoteRequest"
            examples:
              note:
                value:
                  body: Investigated; replacement device scheduled for the next maintenance window.
      responses:
        "201":
          description: Created note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNote"
        "400":
          description: Malformed body or empty note text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No bearer token was presented, the token failed verification, or authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Case not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Case writes require the postgres read source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/cases/{id}/workflows:
    post:
      tags:
        - Cases
      operationId: attachCaseWorkflow
      summary: Attach a Workflow to a case
      description: >
        Resolves the Workflow definition id and version in the code registry,
        creates a pending Workflow Instance with one pending Job per Job step
        (Gates and Tasks are not Jobs; they surface as instance pauses), and
        writes a workflow_attached Timeline Event attributed to the
        authenticated Operator. The instance then advances from pending
        through running to a pause at the definition's first Approval Gate
        (waiting_for_approval), with the Atlas system actor attributing the
        advancement Timeline Events. Attaching to a closed Case is a conflict.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachWorkflowRequest"
            examples:
              replaceOSD:
                value:
                  workflowId: replace-osd
                  workflowVersion: 1
      responses:
        "201":
          description: Attached Workflow Instance, parked at its first Approval Gate when the definition has one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstance"
        "400":
          description: Malformed body, missing workflowId, or non-positive workflowVersion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No bearer token was presented, the token failed verification, or authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Case or Workflow definition not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Case is closed; closed Cases do not accept new Workflow Instances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Workflow writes require the postgres read source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags:
        - Cases
      operationId: listCaseWorkflows
      summary: List Workflow Instances attached to a case
      description: Workflow Instances for the Case in creation order.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Workflow Instances ordered oldest to newest.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowInstance"
        "404":
          description: Case not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Workflow reads require the postgres read source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workflow-instances/{id}/approvals:
    post:
      tags:
        - Cases
      operationId: approveWorkflowGate
      summary: Approve the gate a Workflow Instance is paused at
      description: >
        Records the durable, immutable Approval (approver subject and
        display-name snapshot, gate binding, optional reason, timestamp) and
        advances the instance past the gate to running with a
        workflow_state_changed Timeline Event attributed to the approving
        Operator. The instance must be waiting_for_approval at exactly this
        gate; approving any other gate is rejected. A second approval of an
        already-passed gate is an idempotent no-op returning the existing
        record without touching the instance. The Approval record is the
        authorization evidence; no Audit Events are written. When the fake
        agent loop is enabled (ATLAS_AGENT_MODE=fake), the resumed instance
        is also driven through its Jobs synchronously and pauses at the
        next human Task or reaches a terminal state within this request;
        with the agent loop disabled the instance rests running with
        pending Jobs.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveWorkflowGateRequest"
            examples:
              withReason:
                value:
                  gateId: approve-destroy
                  reason: Replacement device verified in the maintenance window.
      responses:
        "201":
          description: >
            Recorded the Approval and advanced the instance past the gate;
            with the fake agent loop enabled the instance has also been
            driven through its Jobs to a pause or terminal state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowApproval"
        "200":
          description: The gate was already approved; the existing Approval is returned as an idempotent no-op.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowApproval"
        "400":
          description: Malformed body or missing gateId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No bearer token was presented, the token failed verification, or authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workflow Instance not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Instance is not waiting_for_approval at the supplied gate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Workflow writes require the postgres read source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workflow-instances/{id}/task-completions:
    post:
      tags:
        - Cases
      operationId: completeWorkflowTask
      summary: Record the Operator's completion of the Task a Workflow Instance is paused at
      description: >
        Records the durable, immutable Task completion (operator subject
        and display-name snapshot, task binding, optional note, timestamp)
        and resumes the instance past the human Task to running with a
        workflow_state_changed Timeline Event attributed to the resuming
        Operator (ADR-0019). The instance must be waiting_for_operator at
        exactly this task; completing any other task is rejected. A second
        completion of an already-passed task is an idempotent no-op
        returning the existing record without touching the instance. When
        the fake agent loop is enabled (ATLAS_AGENT_MODE=fake), the
        resumed instance is also driven through its remaining Jobs
        synchronously and pauses at the next human Task or reaches a
        terminal state within this request; with the agent loop disabled
        the instance rests running with pending Jobs.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteWorkflowTaskRequest"
            examples:
              withNote:
                value:
                  taskId: replace-device
                  note: Replacement device installed and seated.
      responses:
        "201":
          description: >
            Recorded the Task completion and resumed the instance; with
            the fake agent loop enabled the instance has also been driven
            through its remaining Jobs to a pause or terminal state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTaskCompletion"
        "200":
          description: The task was already completed; the existing record is returned as an idempotent no-op.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTaskCompletion"
        "400":
          description: Malformed body or missing taskId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No bearer token was presented, the token failed verification, or authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workflow Instance not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Instance is not waiting_for_operator at the supplied task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Workflow writes require the postgres read source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workflow-instances/{id}/jobs:
    get:
      tags:
        - Cases
      operationId: listWorkflowJobs
      summary: List a Workflow Instance's Jobs
      description: >
        The instance's Jobs in definition order, with per-Job state and
        attempt progress (ADR-0019). Job transitions do not write Timeline
        Events; instance-level state changes do.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Jobs ordered by definition position.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowJob"
        "404":
          description: Workflow Instance not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Workflow reads require the postgres read source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        RS256 JWT issued by the configured OIDC issuer, verified against its
        JWKS. Required on write endpoints; read endpoints stay public.
  responses:
    Error:
      description: Request failed before a valid resource response could be produced.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            providerUnavailable:
              value:
                error:
                  class: Unavailable
                  message: provider is unavailable
  schemas:
    HealthzResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    MeResponse:
      type: object
      additionalProperties: false
      required:
        - subject
        - displayName
      properties:
        subject:
          type: string
          description: Verified OIDC subject of the operator.
        displayName:
          type: string
          description: Display name resolved from token claims, falling back to the subject.
    ClusterRegistration:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - clusterType
      properties:
        id:
          type: integer
          format: int64
          description: Cluster registration id.
        fsid:
          type:
            - string
            - "null"
          description: Ceph cluster FSID, bound at Enrollment; null until then.
        name:
          type: string
          description: Operator-chosen display name.
        cephVersion:
          type:
            - string
            - "null"
          description: Reported Ceph version; null until the first observation.
        clusterType:
          $ref: "#/components/schemas/ClusterType"
        registeredAt:
          type:
            - string
            - "null"
          format: date-time
          description: When the Operator registered the cluster.
        registeredBy:
          type: string
          description: Subject of the Operator who registered the cluster.
        deregisteredAt:
          type:
            - string
            - "null"
          format: date-time
          description: When the cluster was deregistered; null while active.
    EnrollmentCredential:
      type: object
      additionalProperties: false
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          description: One-time enrollment credential; shown exactly once.
        expiresAt:
          type: string
          format: date-time
          description: When the credential expires if unused.
    CreateClusterRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - clusterType
      properties:
        name:
          type: string
          description: Operator-chosen display name.
        clusterType:
          $ref: "#/components/schemas/ClusterType"
    CreateClusterRegistrationResponse:
      type: object
      additionalProperties: false
      required:
        - cluster
        - enrollmentCredential
      properties:
        cluster:
          $ref: "#/components/schemas/ClusterRegistration"
        enrollmentCredential:
          $ref: "#/components/schemas/EnrollmentCredential"
    ClusterIdentity:
      type: object
      additionalProperties: false
      required:
        - fsid
        - name
        - cephVersion
        - type
      properties:
        fsid:
          type: string
          description: Ceph cluster FSID.
        name:
          type: string
          description: Atlas display name for the cluster.
        cephVersion:
          type: string
          description: Reported Ceph version family.
        type:
          $ref: "#/components/schemas/ClusterType"
    ClusterType:
      type: string
      enum:
        - bare-metal
        - rook
    ClusterHealth:
      type: object
      additionalProperties: false
      required:
        - status
        - summary
        - checks
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        summary:
          type: string
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
    HealthStatus:
      type: string
      enum:
        - HEALTH_OK
        - HEALTH_WARN
        - HEALTH_ERR
    HealthCheck:
      type: object
      additionalProperties: false
      required:
        - name
        - severity
        - summary
      properties:
        name:
          type: string
        severity:
          type: string
        summary:
          type: string
    OSD:
      type: object
      additionalProperties: false
      required:
        - id
        - host
        - up
        - in
      properties:
        id:
          type: integer
          format: int32
        host:
          type: string
        up:
          type: boolean
        in:
          type: boolean
        device:
          type: string
    Host:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: Host name as known to the cluster.
        address:
          type: string
          description: Address metadata where available.
    StorageDevice:
      type: object
      additionalProperties: false
      required:
        - host
        - serial
      properties:
        host:
          type: string
          description: Host the Storage Device is attached to.
        serial:
          type: string
          description: Storage Device serial number; its durable identity in the read model.
        type:
          type: string
          description: Device media type where known, e.g. nvme, ssd, hdd.
        path:
          type: string
          description: Device path where available.
        health:
          type: string
          description: Device health evidence where available.
        osdId:
          type: integer
          format: int32
          description: OSD identity this device currently backs, when one exists.
    Daemon:
      type: object
      additionalProperties: false
      required:
        - type
        - name
        - host
        - status
      properties:
        type:
          $ref: "#/components/schemas/DaemonType"
        name:
          type: string
          description: Ceph daemon name, e.g. mon.a, osd.0.
        host:
          type: string
        status:
          $ref: "#/components/schemas/DaemonStatus"
        version:
          type: string
          description: Daemon Ceph version where available.
    DaemonType:
      type: string
      enum:
        - mon
        - mgr
        - osd
        - mds
        - rgw
    DaemonStatus:
      type: string
      enum:
        - running
        - stopped
        - starting
        - error
        - unknown
    Pool:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - type
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        type:
          $ref: "#/components/schemas/PoolType"
        size:
          type: integer
          format: int32
          description: Replica or data-chunk count where available.
        minSize:
          type: integer
          format: int32
          description: Minimum replicas or chunks for writes where available.
    PoolType:
      type: string
      enum:
        - replicated
        - erasure
    InventorySyncRun:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - status
        - startedAt
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
          enum:
            - fake
        scenario:
          type: string
        status:
          $ref: "#/components/schemas/InventorySyncRunStatus"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        snapshotId:
          type: integer
          format: int64
        errorClass:
          $ref: "#/components/schemas/ErrorClass"
        errorMessage:
          type: string
    InventorySyncRunStatus:
      type: string
      enum:
        - running
        - succeeded
        - failed
    AlertEvaluationRun:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - status
        - startedAt
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
          enum:
            - fake
        scenario:
          type: string
        status:
          $ref: "#/components/schemas/AlertEvaluationRunStatus"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        errorClass:
          $ref: "#/components/schemas/ErrorClass"
        errorMessage:
          type: string
        alertsEvaluated:
          type: integer
          format: int32
          description: Alert count processed by the run, set on success.
        casesCreated:
          type: integer
          format: int32
          description: Cases created by the run, set on success.
    AlertEvaluationRunStatus:
      type: string
      enum:
        - running
        - succeeded
        - failed
    Case:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - summary
        - status
        - severity
        - source
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        summary:
          type: string
        status:
          $ref: "#/components/schemas/CaseStatus"
        severity:
          $ref: "#/components/schemas/CaseSeverity"
        source:
          $ref: "#/components/schemas/CaseSource"
        clusterFsid:
          type: string
          description: Ceph cluster FSID associated with the case when known.
        assignee:
          type: string
          description: OIDC subject of the assigned Operator, when one is assigned.
        assigneeDisplayName:
          type: string
          description: Display name snapshot of the assigned Operator.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        detectedBy:
          $ref: "#/components/schemas/CaseDetectionLink"
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - summary
        - severity
      properties:
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        severity:
          $ref: "#/components/schemas/CaseSeverity"
        clusterFsid:
          type: string
          format: uuid
          description: Cluster FSID to associate with the case, when known.
    TransitionCaseRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/CaseStatus"
    AssignCaseRequest:
      type: object
      additionalProperties: false
      properties:
        assignee:
          type: string
          description: OIDC subject to assign; empty unassigns.
        assigneeDisplayName:
          type: string
          description: Display name snapshot; required when assignee is set, empty when unassigning.
    AddCaseNoteRequest:
      type: object
      additionalProperties: false
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
    AttachWorkflowRequest:
      type: object
      additionalProperties: false
      required:
        - workflowId
        - workflowVersion
      properties:
        workflowId:
          type: string
          minLength: 1
          description: Workflow definition id in the code registry, e.g. replace-osd.
        workflowVersion:
          type: integer
          minimum: 1
          description: Workflow definition version to attach.
    ApproveWorkflowGateRequest:
      type: object
      additionalProperties: false
      required:
        - gateId
      properties:
        gateId:
          type: string
          minLength: 1
          description: Definition step id of the Approval Gate to approve; must be the instance's current step.
        reason:
          type: string
          description: Optional reason snapshot recorded with the Approval.
    WorkflowApproval:
      type: object
      additionalProperties: false
      required:
        - id
        - workflowInstanceId
        - gateId
        - approverId
        - approverDisplayName
        - reason
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        workflowInstanceId:
          type: integer
          format: int64
        gateId:
          type: string
          description: Definition step id of the gate this Approval advanced.
        approverId:
          type: string
          description: OIDC subject of the approving Operator.
        approverDisplayName:
          type: string
          description: Display name snapshot of the approver at approval time.
        reason:
          type: string
          description: Optional reason snapshot; null when none was given.
        createdAt:
          type: string
          format: date-time
    CompleteWorkflowTaskRequest:
      type: object
      additionalProperties: false
      required:
        - taskId
      properties:
        taskId:
          type: string
          minLength: 1
          description: Definition step id of the human Task to complete; must be the instance's current step.
        note:
          type: string
          description: Optional note snapshot recorded with the Task completion.
    WorkflowTaskCompletion:
      type: object
      additionalProperties: false
      required:
        - id
        - workflowInstanceId
        - taskId
        - operatorId
        - operatorDisplayName
        - note
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        workflowInstanceId:
          type: integer
          format: int64
        taskId:
          type: string
          description: Definition step id of the Task this completion advanced.
        operatorId:
          type: string
          description: OIDC subject of the Operator who performed the Task.
        operatorDisplayName:
          type: string
          description: Display name snapshot of the operator at completion time.
        note:
          type: string
          description: Optional note snapshot; null when none was given.
        createdAt:
          type: string
          format: date-time
    CaseNote:
      type: object
      additionalProperties: false
      required:
        - id
        - caseId
        - authorId
        - authorDisplayName
        - body
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        caseId:
          type: integer
          format: int64
        authorId:
          type: string
          description: OIDC subject of the Operator who wrote the note.
        authorDisplayName:
          type: string
          description: Display name snapshot of the note author.
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    CaseDetectionLink:
      type: object
      additionalProperties: false
      required:
        - source
        - alertName
        - firstSeenAt
        - lastSeenAt
      properties:
        source:
          $ref: "#/components/schemas/CaseSource"
        alertName:
          type: string
          description: Normalized alert name that detected the case, e.g. CephOSDDown.
        signal:
          type: string
          description: Normalized signal identifier, e.g. CEPH_OSD_DOWN.
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    CaseStatus:
      type: string
      enum:
        - detected
        - triaged
        - closed
    CaseSeverity:
      type: string
      enum:
        - info
        - low
        - medium
        - high
        - critical
    CaseSource:
      type: string
      enum:
        - manual
        - prometheus
        - ceph
        - rook
        - atlas
    WorkflowInstanceState:
      type: string
      description: Workflow Instance state machine (ADR-0019); terminal states never revert.
      enum:
        - pending
        - running
        - waiting_for_approval
        - waiting_for_operator
        - succeeded
        - failed
        - cancelled
    WorkflowInstance:
      type: object
      additionalProperties: false
      required:
        - id
        - caseId
        - workflowId
        - workflowVersion
        - state
        - currentStep
        - createdAt
        - updatedAt
        - finishedAt
      properties:
        id:
          type: integer
          format: int64
        caseId:
          type: integer
          format: int64
        workflowId:
          type: string
          description: Workflow definition id this instance executes.
        workflowVersion:
          type: integer
          description: Workflow definition version this instance executes.
        state:
          $ref: "#/components/schemas/WorkflowInstanceState"
        currentStep:
          type: string
          description: Definition step id the instance is paused at; null while running or terminal.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          description: Set when the instance reaches a terminal state; null before that.
    WorkflowJobState:
      type: string
      description: >
        Job state machine (ADR-0019): pending, dispatched, or terminal
        succeeded and failed, where failed may re-enter pending as a retry
        governed by the definition's retry policy.
      enum:
        - pending
        - dispatched
        - succeeded
        - failed
    WorkflowJob:
      type: object
      additionalProperties: false
      required:
        - id
        - workflowInstanceId
        - position
        - stepId
        - operationType
        - state
        - attempt
        - maxAttempts
        - createdAt
        - updatedAt
        - finishedAt
      properties:
        id:
          type: integer
          format: int64
        workflowInstanceId:
          type: integer
          format: int64
        position:
          type: integer
          description: 1-based position in the definition's step order.
        stepId:
          type: string
          description: Definition step id this Job executes.
        operationType:
          type: string
          description: Typed agent operation type (ADR-0018), e.g. DestroyOSD.
        state:
          $ref: "#/components/schemas/WorkflowJobState"
        attempt:
          type: integer
          description: Current attempt number; a retry consumes one attempt.
        maxAttempts:
          type: integer
          description: Retry budget from the definition's retry policy.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          description: Set when the Job reaches a terminal state; null before that.
    TimelineEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - caseId
        - type
        - message
        - occurredAt
        - actor
        - payload
      properties:
        id:
          type: integer
          format: int64
        caseId:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TimelineEventType"
        message:
          type: string
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/TimelineActor"
        payload:
          type: object
          additionalProperties: true
          description: Type-specific normalized Atlas context.
    TimelineEventType:
      type: string
      enum:
        - case_detected
        - case_triaged
        - case_status_changed
        - case_note_added
