openapi: 3.1.0
info:
  title: Atlas API
  version: 0.3.0
  description: >
    Read-only Atlas REST API contract for the fake-provider scaffold. Covers
    local health, current-cluster inventory reads (identity, health, OSDs,
    Hosts, Storage Devices, Ceph Daemons, Pools), explicit inventory sync run
    history, and read-only case records.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Platform
  - name: Clusters
  - name: Inventory
  - name: Cases
paths:
  /healthz:
    get:
      tags:
        - Platform
      operationId: getHealthz
      summary: Check API process health
      responses:
        "200":
          description: API process is serving requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"
              examples:
                ok:
                  value:
                    status: ok
  /api/v1/clusters/current:
    get:
      tags:
        - Clusters
      operationId: getCurrentCluster
      summary: Get the current cluster identity
      responses:
        "200":
          description: Current cluster identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterIdentity"
              examples:
                reefBareMetal:
                  value:
                    fsid: 00000000-0000-4000-8000-000000000101
                    name: reef-baremetal-healthy
                    cephVersion: 18.2.x
                    type: bare-metal
        default:
          $ref: "#/components/responses/Error"
  /api/v1/clusters/current/health:
    get:
      tags:
        - Clusters
      operationId: getCurrentClusterHealth
      summary: Get the current cluster health
      responses:
        "200":
          description: Current cluster health summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterHealth"
              examples:
                healthWarn:
                  value:
                    status: HEALTH_WARN
                    summary: 1 osd down
                    checks:
                      - name: OSD_DOWN
                        severity: HEALTH_WARN
                        summary: 1 osd down
        default:
          $ref: "#/components/responses/Error"
  /api/v1/clusters/current/osds:
    get:
      tags:
        - Clusters
      operationId: listCurrentClusterOSDs
      summary: List OSD inventory for the current cluster
      responses:
        "200":
          description: Current cluster OSD inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OSD"
              examples:
                osds:
                  value:
                    - id: 0
                      host: host-a.example.invalid
                      up: true
                      in: true
                      device: nvme-serial-a
                    - id: 1
                      host: host-b.example.invalid
                      up: false
                      in: true
                      device: nvme-serial-b
        default:
          $ref: "#/components/responses/Error"
  /api/v1/clusters/current/hosts:
    get:
      tags:
        - Clusters
      operationId: listCurrentClusterHosts
      summary: List Host inventory for the current cluster
      responses:
        "200":
          description: Current cluster Host inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Host"
              examples:
                hosts:
                  value:
                    - name: host-a.example.invalid
                      address: 192.0.2.11
                    - name: host-b.example.invalid
                      address: 192.0.2.12
        default:
          $ref: "#/components/responses/Error"
  /api/v1/clusters/current/storage-devices:
    get:
      tags:
        - Clusters
      operationId: listCurrentClusterStorageDevices
      summary: List Storage Device inventory for the current cluster
      description: >
        Flat listing across all Hosts. Each Storage Device names its Host and,
        where one exists, the OSD identity it currently backs. The OSD link is
        point-in-time; a Storage Device may back different OSD identities over
        time.
      responses:
        "200":
          description: Current cluster Storage Device inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageDevice"
              examples:
                devices:
                  value:
                    - host: host-a.example.invalid
                      serial: nvme-serial-a
                      type: nvme
                      path: /dev/nvme0n1
                      health: ok
                      osdId: 0
                    - host: host-b.example.invalid
                      serial: nvme-serial-b
                      type: nvme
                      path: /dev/nvme0n1
                      health: error
                      osdId: 1
                    - host: host-c.example.invalid
                      serial: spare-serial-c
                      type: ssd
                      path: /dev/sdb
                      health: ok
        default:
          $ref: "#/components/responses/Error"
  /api/v1/clusters/current/daemons:
    get:
      tags:
        - Clusters
      operationId: listCurrentClusterDaemons
      summary: List Ceph Daemon inventory for the current cluster
      responses:
        "200":
          description: Current cluster Ceph Daemon inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Daemon"
              examples:
                daemons:
                  value:
                    - type: mon
                      name: mon.a
                      host: host-a.example.invalid
                      status: running
                      version: 18.2.x
                    - type: osd
                      name: osd.1
                      host: host-b.example.invalid
                      status: stopped
                      version: 18.2.x
        default:
          $ref: "#/components/responses/Error"
  /api/v1/clusters/current/pools:
    get:
      tags:
        - Clusters
      operationId: listCurrentClusterPools
      summary: List Pool inventory for the current cluster
      responses:
        "200":
          description: Current cluster Pool inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pool"
              examples:
                pools:
                  value:
                    - id: 1
                      name: device_health_metrics
                      type: replicated
                      size: 3
                      minSize: 2
                    - id: 2
                      name: .mgr
                      type: replicated
                      size: 3
                      minSize: 2
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory-sync-runs:
    get:
      tags:
        - Inventory
      operationId: listInventorySyncRuns
      summary: List recent inventory sync runs
      responses:
        "200":
          description: Recent inventory sync run history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventorySyncRun"
              examples:
                runs:
                  value:
                    - id: 2
                      provider: fake
                      scenario: missing
                      status: failed
                      startedAt: "2026-08-13T12:01:00Z"
                      finishedAt: "2026-08-13T12:01:01Z"
                      errorClass: Unavailable
                      errorMessage: "Unavailable: read fixture"
                    - id: 1
                      provider: fake
                      scenario: reef-osd-down-baremetal
                      status: succeeded
                      startedAt: "2026-08-13T12:00:00Z"
                      finishedAt: "2026-08-13T12:00:01Z"
                      snapshotId: 1
        default:
          $ref: "#/components/responses/Error"
  /api/v1/alert-evaluation-runs:
    get:
      tags:
        - Inventory
      operationId: listAlertEvaluationRuns
      summary: List recent alert evaluation runs
      responses:
        "200":
          description: Recent alert evaluation run history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertEvaluationRun"
              examples:
                runs:
                  value:
                    - id: 2
                      provider: fake
                      scenario: osd-down-alert
                      status: succeeded
                      startedAt: "2026-08-14T09:20:00Z"
                      finishedAt: "2026-08-14T09:20:01Z"
                      alertsEvaluated: 1
                      casesCreated: 1
                    - id: 1
                      provider: fake
                      scenario: provider-unauthorized
                      status: failed
                      startedAt: "2026-08-14T09:15:00Z"
                      finishedAt: "2026-08-14T09:15:01Z"
                      errorClass: Unauthorized
                      errorMessage: "Unauthorized: simulated observability source rejected provider credentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/cases:
    get:
      tags:
        - Cases
      operationId: listCases
      summary: List cases
      responses:
        "200":
          description: Recent cases ordered by most recent update.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
              examples:
                seededCases:
                  value:
                    - id: 2
                      title: Review weekly capacity trend
                      summary: Local seed case for capacity review without an automation workflow attached.
                      status: triaged
                      severity: medium
                      source: manual
                      clusterFsid: 00000000-0000-4000-8000-000000000101
                      createdAt: "2026-08-13T12:05:00Z"
                      updatedAt: "2026-08-13T12:10:00Z"
                    - id: 1
                      title: OSD down requires triage
                      summary: Local seed case representing an OSD_DOWN health check that needs operator triage.
                      status: detected
                      severity: high
                      source: prometheus
                      clusterFsid: 00000000-0000-4000-8000-000000000101
                      createdAt: "2026-08-13T12:00:00Z"
                      updatedAt: "2026-08-13T12:00:00Z"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/cases/{id}:
    get:
      tags:
        - Cases
      operationId: getCase
      summary: Get a case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Case detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/cases/{id}/timeline:
    get:
      tags:
        - Cases
      operationId: listCaseTimeline
      summary: List a case timeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Case Timeline Events ordered oldest to newest.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"
              examples:
                seededTimeline:
                  value:
                    - id: 2
                      caseId: 2
                      type: case_detected
                      message: Manual capacity review case created.
                      occurredAt: "2026-08-13T12:05:00Z"
                      actor:
                        type: user
                        displayName: Storage Operator
                      payload:
                        source: manual
                        clusterFsid: 00000000-0000-4000-8000-000000000101
                    - id: 3
                      caseId: 2
                      type: case_triaged
                      message: Capacity review case triaged.
                      occurredAt: "2026-08-13T12:10:00Z"
                      actor:
                        type: user
                        displayName: Storage Operator
                      payload:
                        previousStatus: detected
                        newStatus: triaged
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Request failed before a valid resource response could be produced.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            providerUnavailable:
              value:
                error:
                  class: Unavailable
                  message: provider is unavailable
  schemas:
    HealthzResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ClusterIdentity:
      type: object
      additionalProperties: false
      required:
        - fsid
        - name
        - cephVersion
        - type
      properties:
        fsid:
          type: string
          description: Ceph cluster FSID.
        name:
          type: string
          description: Atlas display name for the cluster.
        cephVersion:
          type: string
          description: Reported Ceph version family.
        type:
          $ref: "#/components/schemas/ClusterType"
    ClusterType:
      type: string
      enum:
        - bare-metal
        - rook
    ClusterHealth:
      type: object
      additionalProperties: false
      required:
        - status
        - summary
        - checks
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        summary:
          type: string
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
    HealthStatus:
      type: string
      enum:
        - HEALTH_OK
        - HEALTH_WARN
        - HEALTH_ERR
    HealthCheck:
      type: object
      additionalProperties: false
      required:
        - name
        - severity
        - summary
      properties:
        name:
          type: string
        severity:
          type: string
        summary:
          type: string
    OSD:
      type: object
      additionalProperties: false
      required:
        - id
        - host
        - up
        - in
      properties:
        id:
          type: integer
          format: int32
        host:
          type: string
        up:
          type: boolean
        in:
          type: boolean
        device:
          type: string
    Host:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: Host name as known to the cluster.
        address:
          type: string
          description: Address metadata where available.
    StorageDevice:
      type: object
      additionalProperties: false
      required:
        - host
        - serial
      properties:
        host:
          type: string
          description: Host the Storage Device is attached to.
        serial:
          type: string
          description: Storage Device serial number; its durable identity in the read model.
        type:
          type: string
          description: Device media type where known, e.g. nvme, ssd, hdd.
        path:
          type: string
          description: Device path where available.
        health:
          type: string
          description: Device health evidence where available.
        osdId:
          type: integer
          format: int32
          description: OSD identity this device currently backs, when one exists.
    Daemon:
      type: object
      additionalProperties: false
      required:
        - type
        - name
        - host
        - status
      properties:
        type:
          $ref: "#/components/schemas/DaemonType"
        name:
          type: string
          description: Ceph daemon name, e.g. mon.a, osd.0.
        host:
          type: string
        status:
          $ref: "#/components/schemas/DaemonStatus"
        version:
          type: string
          description: Daemon Ceph version where available.
    DaemonType:
      type: string
      enum:
        - mon
        - mgr
        - osd
        - mds
        - rgw
    DaemonStatus:
      type: string
      enum:
        - running
        - stopped
    Pool:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - type
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        type:
          $ref: "#/components/schemas/PoolType"
        size:
          type: integer
          format: int32
          description: Replica or data-chunk count where available.
        minSize:
          type: integer
          format: int32
          description: Minimum replicas or chunks for writes where available.
    PoolType:
      type: string
      enum:
        - replicated
        - erasure
    InventorySyncRun:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - status
        - startedAt
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
          enum:
            - fake
        scenario:
          type: string
        status:
          $ref: "#/components/schemas/InventorySyncRunStatus"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        snapshotId:
          type: integer
          format: int64
        errorClass:
          $ref: "#/components/schemas/ErrorClass"
        errorMessage:
          type: string
    InventorySyncRunStatus:
      type: string
      enum:
        - running
        - succeeded
        - failed
    AlertEvaluationRun:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - status
        - startedAt
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
          enum:
            - fake
        scenario:
          type: string
        status:
          $ref: "#/components/schemas/AlertEvaluationRunStatus"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        errorClass:
          $ref: "#/components/schemas/ErrorClass"
        errorMessage:
          type: string
        alertsEvaluated:
          type: integer
          format: int32
          description: Alert count processed by the run, set on success.
        casesCreated:
          type: integer
          format: int32
          description: Cases created by the run, set on success.
    AlertEvaluationRunStatus:
      type: string
      enum:
        - running
        - succeeded
        - failed
    Case:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - summary
        - status
        - severity
        - source
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        summary:
          type: string
        status:
          $ref: "#/components/schemas/CaseStatus"
        severity:
          $ref: "#/components/schemas/CaseSeverity"
        source:
          $ref: "#/components/schemas/CaseSource"
        clusterFsid:
          type: string
          description: Ceph cluster FSID associated with the case when known.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        detectedBy:
          $ref: "#/components/schemas/CaseDetectionLink"
    CaseDetectionLink:
      type: object
      additionalProperties: false
      required:
        - source
        - alertName
        - firstSeenAt
        - lastSeenAt
      properties:
        source:
          $ref: "#/components/schemas/CaseSource"
        alertName:
          type: string
          description: Normalized alert name that detected the case, e.g. CephOSDDown.
        signal:
          type: string
          description: Normalized signal identifier, e.g. CEPH_OSD_DOWN.
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    CaseStatus:
      type: string
      enum:
        - detected
        - triaged
        - closed
    CaseSeverity:
      type: string
      enum:
        - info
        - low
        - medium
        - high
        - critical
    CaseSource:
      type: string
      enum:
        - manual
        - prometheus
        - ceph
        - rook
        - atlas
    TimelineEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - caseId
        - type
        - message
        - occurredAt
        - actor
        - payload
      properties:
        id:
          type: integer
          format: int64
        caseId:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TimelineEventType"
        message:
          type: string
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/TimelineActor"
        payload:
          type: object
          additionalProperties: true
          description: Type-specific normalized Atlas context.
    TimelineEventType:
      type: string
      enum:
        - case_detected
        - case_triaged
        - case_status_changed
        - case_note_added
        - workflow_attached
        - workflow_state_changed
    TimelineActor:
      type: object
      additionalProperties: false
      required:
        - type
        - displayName
      properties:
        type:
          $ref: "#/components/schemas/TimelineActorType"
        id:
          type: string
        displayName:
          type: string
    TimelineActorType:
      type: string
      enum:
        - system
        - user
        - atlas_agent
        - provider
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - class
        - message
      properties:
        class:
          $ref: "#/components/schemas/ErrorClass"
        message:
          type: string
    ErrorClass:
      type: string
      enum:
        - Internal
        - Unavailable
        - Unauthorized
        - Unsupported
        - VersionUnsupported
        - NotFound
        - Conflict
        - Unsafe
        - Partial
        - MalformedResponse
        - Timeout
